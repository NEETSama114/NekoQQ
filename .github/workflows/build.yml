name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 升级到 v5，使用 JDK 17 并开启缓存（消除 Node.js 20 弃用警告）
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 2. 配置指定的 Gradle 环境，使用 8.9 版本以满足 AGP 8.2.2 的要求
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 3. 核心：由于仓库缺失文件，让云端自动生成 Wrapper 脚本
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      # 4. 赋予执行权限，并开启详细日志进行编译
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --info

      # 5. 只有构建成功才上传 APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NekoQQ-debug
          path: app/build/outputs/apk/debug/*.apk
