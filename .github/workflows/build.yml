name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: |
        # 强制在 Gradle 全局初始化配置中加入 Xposed 官方仓库源
        mkdir -p ~/.gradle
        echo "allprojects { repositories { google(); mavenCentral(); maven { url 'https://api.xposed.info/' } } }" >> ~/.gradle/init.gradle
        
        # 执行构建
        ./gradlew :app:assembleDebug --stacktrace || gradle :app:assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NekoQQ-debug
        path: '**/build/outputs/apk/debug/*.apk'
