name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle Wrapper
      run: |
        # 使用项目自带的 gradlew 编译，并在全局仓库中强行加入 xposed 源
        mkdir -p ~/.gradle
        echo "allprojects { repositories { google(); mavenCentral(); maven { url 'https://api.xposed.info/' } } }" >> ~/.gradle/init.gradle
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NekoQQ-debug
        path: '**/build/outputs/apk/debug/*.apk'
